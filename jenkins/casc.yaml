jenkins:
  systemMessage: 'Toolshop tests: local Jenkins, configured from jenkins/casc.yaml'
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: ${JENKINS_ADMIN_PASSWORD}
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: toolshop-customer
              description: Seeded customer of the local app
              username: ${CUSTOMER_EMAIL}
              password: ${CUSTOMER_PASSWORD}
          - usernamePassword:
              scope: GLOBAL
              id: toolshop-admin
              description: Seeded admin of the local app
              username: ${ADMIN_EMAIL}
              password: ${ADMIN_PASSWORD}

unclassified:
  location:
    url: http://localhost:8080/

jobs:
  - script: |
      multibranchPipelineJob('toolshop-tests') {
        displayName('Toolshop tests')
        branchSources {
          branchSource {
            source {
              git {
                id('toolshop-github')
                remote('https://github.com/TheBigBadWolf228/toolshop-testing-framework.git')
                traits {
                  gitBranchDiscovery()
                }
              }
            }
          }
        }
        factory {
          workflowBranchProjectFactory {
            scriptPath('Jenkinsfile')
          }
        }
        orphanedItemStrategy {
          discardOldItems {
            numToKeep(5)
          }
        }
        triggers {
          periodicFolderTrigger {
            interval('5m')
          }
        }
      }
