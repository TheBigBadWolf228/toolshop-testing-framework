name: LLM Evals
on:
  push:
    branches: [ai-evals-in-ci]
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  MODELS: qwen2.5:1.5b llama3.2:3b nomic-embed-text
jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ai-action/setup-ollama@v2
        with:
          version: 0.40.16
      - name: Pull models
        run: for m in $MODELS; do ollama pull "$m"; done
      - name: Run evals
        run: npm run test:evals -- -o reports/evals.html -o reports/evals.json
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          jq -r '.results.stats | "Evals: \(.successes) passed, \(.failures) failed, \(.errors) errors"' reports/evals.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: evals-report
          path: reports/
          retention-days: 7
