name: Performance
on:
  schedule:
    - cron: '0 5 * * 0'
  workflow_dispatch:
  push:
    branches: [k6-performance-testing]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_URL: http://localhost:8091
      K6_WEB_DASHBOARD: 'true'
      K6_WEB_DASHBOARD_EXPORT: reports/k6.html
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/start-app
        timeout-minutes: 10
      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: 2.4.0
      - name: Run k6
        run: |
          mkdir -p reports
          k6 run --summary-export=reports/k6-summary.json perf/products.js
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          jq -r '.metrics | "k6 /products: p(95) \(.http_req_duration["p(95)"] | floor) ms, failed \(.http_req_failed.value * 100)%, checks \(.checks.value * 100)%"' reports/k6-summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: perf-report
          path: reports/
          retention-days: 7
  notify:
    needs: perf
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/notify-issue
        with:
          label: perf
          title: Performance test failed
          result: ${{ needs.perf.result }}
