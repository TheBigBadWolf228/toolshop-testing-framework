name: Playwright Tests
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '.vscode/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '20 2 * * *'
  workflow_dispatch:
    inputs:
      browsers:
        type: choice
        options: [all, chrome]
        default: all
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Check formatting
        run: npm run format:check
      - name: Check types
        run: npm run typecheck
      - name: Check Playwright image version
        run: |
          v=$(node -p "require('@playwright/test/package.json').version")
          for f in Dockerfile Jenkinsfile; do
            grep -q "mcr.microsoft.com/playwright:v$v-noble" "$f" || { echo "::error file=$f::Use mcr.microsoft.com/playwright:v$v-noble to match package-lock.json"; exit 1; }
          done
      - name: Check tests load
        run: npx playwright test --list --reporter=list
  smoke:
    needs: gate
    uses: ./.github/workflows/run-tests.yml
    with:
      projects: --project="API" --project="UI Chrome"
      grep: '@smoke'
      report-name: blob-smoke
    secrets:
      CUSTOMER_EMAIL: ${{ secrets.CUSTOMER_EMAIL }}
      CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
  api:
    needs: smoke
    uses: ./.github/workflows/run-tests.yml
    with:
      projects: --project="API"
      workers: '2'
      report-name: blob-full-api
    secrets:
      CUSTOMER_EMAIL: ${{ secrets.CUSTOMER_EMAIL }}
      CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
  ui:
    needs: smoke
    name: UI ${{ matrix.target.browser }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON((github.event_name == 'pull_request' || inputs.browsers == 'chrome') && '[{"project":"UI Chrome","browser":"chromium"}]' || '[{"project":"UI Chrome","browser":"chromium"},{"project":"UI Firefox","browser":"firefox"},{"project":"UI Safari","browser":"webkit"}]') }}
    uses: ./.github/workflows/run-tests.yml
    with:
      projects: --project="${{ matrix.target.project }}"
      workers: '2'
      report-name: blob-full-ui-${{ matrix.target.browser }}
    secrets:
      CUSTOMER_EMAIL: ${{ secrets.CUSTOMER_EMAIL }}
      CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
  ci-ok:
    needs: [gate, smoke, api, ui]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
  report:
    needs: [smoke, api, ui]
    if: ${{ !cancelled() && needs.smoke.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ needs.smoke.result == 'success' && 'blob-full-*' || 'blob-smoke' }}
          path: all-blob-reports
          merge-multiple: true
      - name: Merge reports
        run: SUMMARY_FILE="$GITHUB_STEP_SUMMARY" npx playwright merge-reports --reporter html,./tests/support/summary-reporter.ts ./all-blob-reports
      - uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ needs.smoke.result == 'success' && 'allure-blob-full-*' || 'allure-blob-smoke' }}
          path: allure-results
          merge-multiple: true
      - name: Get Allure history from the last published report
        run: curl -fsSL -o allure-history.jsonl https://thebigbadwolf228.github.io/toolshop-testing-framework/history.jsonl || rm -f allure-history.jsonl
      - name: Generate Allure report
        run: |
          npx allure generate --history-limit 20
          cp allure-history.jsonl allure-report/history.jsonl
      - uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v5
        if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
        with:
          path: allure-report/
  deploy:
    needs: report
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'schedule') && needs.report.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
  notify:
    needs: [gate, smoke, api, ui, report]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/notify-issue
        with:
          label: main-failure
          title: Run on main failed
          result: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
