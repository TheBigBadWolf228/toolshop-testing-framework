name: Playwright Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CUSTOMER_EMAIL: ${{ secrets.CUSTOMER_EMAIL }}
      CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check the API is reachable
        run: curl -fsS -o /dev/null https://api.practicesoftwaretesting.com/brands
      - name: Install dependencies
        run: npm ci
      # No UI Chrome on CI until the app is self-hosted: Cloudflare on the
      # hosted demo challenges headless Chromium from GitHub runner IPs on every page
      # load. Firefox and WebKit get through. Chrome still runs locally.
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps firefox webkit
      - name: Run Playwright tests
        run: npx playwright test --project="API" --project="UI Firefox" --project="UI Safari"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
