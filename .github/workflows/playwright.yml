name: Playwright Tests
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '.vscode/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', '.vscode/**']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Check formatting
        run: npm run format:check
      - name: Check types
        run: npm run typecheck
      - name: Check tests load
        run: npx playwright test --list --reporter=list
  smoke:
    needs: gate
    uses: ./.github/workflows/run-tests.yml
    with:
      projects: --project="API" --project="UI Firefox"
      browser: firefox
      grep: '@smoke'
      report-name: blob-smoke
    secrets:
      CUSTOMER_EMAIL: ${{ secrets.CUSTOMER_EMAIL }}
      CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
  api:
    needs: smoke
    uses: ./.github/workflows/run-tests.yml
    with:
      projects: --project="API"
      report-name: blob-full-api
    secrets:
      CUSTOMER_EMAIL: ${{ secrets.CUSTOMER_EMAIL }}
      CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
  ui:
    needs: smoke
    name: UI ${{ matrix.target.browser }} ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
    strategy:
      fail-fast: false
      # PRs run one browser, merges to main run all CI browsers.
      # No UI Chrome on CI until the app is self-hosted: Cloudflare on the
      # hosted demo denies headless Chromium from GitHub runner IPs on every page.
      # Firefox and WebKit get through. Chrome still runs locally.
      matrix:
        target: ${{ fromJSON(github.event_name == 'pull_request' && '[{"project":"UI Firefox","browser":"firefox"}]' || '[{"project":"UI Firefox","browser":"firefox"},{"project":"UI Safari","browser":"webkit"}]') }}
        shardIndex: [1, 2]
        shardTotal: [2]
    uses: ./.github/workflows/run-tests.yml
    with:
      projects: --project="${{ matrix.target.project }}"
      browser: ${{ matrix.target.browser }}
      shard: ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
      report-name: blob-full-ui-${{ matrix.target.browser }}-${{ matrix.shardIndex }}
    secrets:
      CUSTOMER_EMAIL: ${{ secrets.CUSTOMER_EMAIL }}
      CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
  report:
    needs: [smoke, api, ui]
    if: ${{ !cancelled() && needs.smoke.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.smoke.result == 'success' && 'blob-full-*' || 'blob-smoke' }}
          path: all-blob-reports
          merge-multiple: true
      - name: Merge reports
        run: npx playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
