name: Playwright Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CUSTOMER_EMAIL: ${{ secrets.CUSTOMER_EMAIL }}
      CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Diagnose app access
        run: |
          curl -sS https://api.ipify.org; echo
          curl -sS -i https://api.practicesoftwaretesting.com/brands | head -20
          curl -sS -o /dev/null -w "browser UA: %{http_code}\n" \
            -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36" \
            https://api.practicesoftwaretesting.com/brands
          curl -sS -o /dev/null -w "ui: %{http_code}\n" https://practicesoftwaretesting.com
      - name: Check the app is reachable
        run: |
          curl -fsS -o /dev/null https://api.practicesoftwaretesting.com/brands
          curl -fsS -o /dev/null https://practicesoftwaretesting.com
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
