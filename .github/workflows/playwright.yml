name: Playwright Tests
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '.vscode/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', '.vscode/**']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Check formatting
        run: npm run format:check
      - name: Check types
        run: npm run typecheck
      - name: Check tests load
        run: npx playwright test --list --reporter=list
  smoke:
    needs: gate
    uses: ./.github/workflows/run-tests.yml
    with:
      projects: --project="API" --project="UI Firefox"
      browser: firefox
      grep: '@smoke'
      report-name: report-smoke
    secrets:
      CUSTOMER_EMAIL: ${{ secrets.CUSTOMER_EMAIL }}
      CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
  api:
    needs: smoke
    uses: ./.github/workflows/run-tests.yml
    with:
      projects: --project="API"
      report-name: report-api
    secrets:
      CUSTOMER_EMAIL: ${{ secrets.CUSTOMER_EMAIL }}
      CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
  ui:
    needs: smoke
    name: UI ${{ matrix.browser }}
    strategy:
      fail-fast: false
      # PRs run one browser, merges to main run all CI browsers.
      # No UI Chrome on CI until the app is self-hosted: Cloudflare on the
      # hosted demo denies headless Chromium from GitHub runner IPs on every page.
      # Firefox and WebKit get through. Chrome still runs locally.
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"project":"UI Firefox","browser":"firefox"}]' || '[{"project":"UI Firefox","browser":"firefox"},{"project":"UI Safari","browser":"webkit"}]') }}
    uses: ./.github/workflows/run-tests.yml
    with:
      projects: --project="${{ matrix.project }}"
      browser: ${{ matrix.browser }}
      report-name: report-ui-${{ matrix.browser }}
    secrets:
      CUSTOMER_EMAIL: ${{ secrets.CUSTOMER_EMAIL }}
      CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
