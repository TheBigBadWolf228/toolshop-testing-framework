name: Run tests
on:
  workflow_call:
    inputs:
      projects:
        type: string
        required: true
      browser:
        type: string
        default: ''
      grep:
        type: string
        default: ''
      report-name:
        type: string
        required: true
    secrets:
      CUSTOMER_EMAIL:
        required: true
      CUSTOMER_PASSWORD:
        required: true
      ADMIN_EMAIL:
        required: true
      ADMIN_PASSWORD:
        required: true
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CUSTOMER_EMAIL: ${{ secrets.CUSTOMER_EMAIL }}
      CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - name: Check the API is reachable
        run: curl -fsS -o /dev/null https://api.practicesoftwaretesting.com/brands
      - uses: ./.github/actions/setup
      - name: Install Playwright Browsers
        if: ${{ inputs.browser != '' }}
        timeout-minutes: 15
        run: npx playwright install --with-deps ${{ inputs.browser }}
      - name: Run Playwright tests
        run: npx playwright test ${{ inputs.projects }} ${{ inputs.grep && format('--grep "{0}"', inputs.grep) || '' }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ${{ inputs.report-name }}
          path: playwright-report/
          retention-days: 30
