name: Start app
description: Toolshop app in Docker on localhost (UI 4200, API 8091), seeded and ready
runs:
  using: composite
  steps:
    - name: Start app and wait until healthy
      shell: bash
      run: docker compose up -d --wait --wait-timeout 300 --quiet-pull
    - name: App logs
      if: failure()
      shell: bash
      run: docker compose logs
