description: Toolshop product assistant, deterministic checks

prompts:
  - '{{question}}'

providers:
  - file://provider.ts

evaluateOptions:
  cache: false
  maxConcurrency: 1

defaultTest:
  assert:
    - type: is-json
      value: file://../assistant/reply.schema.json
      metric: contract
    - type: javascript
      value: file://assertions.ts:grounded
      metric: grounding

tests: file://golden.ts
