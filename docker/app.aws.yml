# Ships container logs to CloudWatch. Used on EC2 only, see `infra/test-env.yml`
x-aws-logs: &aws-logs
  driver: awslogs
  options:
    awslogs-group: ${AWS_LOG_GROUP:?}
    tag: '{{.Name}}'

services:
  mariadb:
    logging: *aws-logs

  redis:
    logging: *aws-logs

  web:
    logging: *aws-logs

  angular-ui:
    logging: *aws-logs

  laravel-api:
    environment:
      LOG_CHANNEL: stderr
    logging:
      driver: awslogs
      options:
        awslogs-group: ${AWS_LOG_GROUP:?}
        tag: '{{.Name}}'
        awslogs-multiline-pattern: '^(\[[0-9]|[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+ )'
