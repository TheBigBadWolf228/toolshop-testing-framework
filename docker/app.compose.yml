# The Toolshop app (sprint5) for tests, based on upstream docker-compose.prod.yml
# (https://github.com/testsmith-io/practice-software-testing).
# No cron service: it runs migrate:fresh --seed every hour and would wipe data mid-run.
# web uses the official nginx image because upstream's web image is arm64 only.
name: toolshop-app

services:
  mariadb:
    image: yobasystems/alpine-mariadb:10.6.11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: toolshop
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot", "--silent"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  laravel-api:
    image: testsmith/practice-software-testing-sprint5-api:2.5
    environment:
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: 1
      DB_HOST: mariadb
      DB_PORT: 3306
      host: localhost
      CACHE_DRIVER: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
    command: sh -c "php artisan migrate:fresh --seed --force && php-fpm"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: nginx:1.23.3-alpine
    volumes:
      - ./web.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - 8091:80
    depends_on:
      - laravel-api
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/status"]
      interval: 2s
      retries: 60

  angular-ui:
    image: testsmith/practice-software-testing-sprint5-ui:2.5
    ports:
      - 4200:4200
    command: bash -c "ng serve --host 0.0.0.0 --port 4200"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:4200"]
      interval: 5s
      retries: 60
